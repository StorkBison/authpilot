name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Data is reproducible
        run: |
          python scripts/generate_patients.py
          git diff --exit-code data/
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -v
      - name: Offline eval baseline
        run: python -m authpilot eval

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t authpilot:ci .
      - name: Smoke test - run story 1 through the API
        run: |
          docker run -d --name ap -p 8000:8000 -e DATABASE_URL=sqlite:///./var/ci.db authpilot:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          ID=$(curl -fs localhost:8000/api/cases | python -c "import sys,json; print(next(c['id'] for c in json.load(sys.stdin) if c['patient_id']=='p-james-walker'))")
          curl -fs -X POST localhost:8000/api/cases/$ID/run
          sleep 3
          curl -fs localhost:8000/api/cases/$ID | python -c "import sys,json; c=json.load(sys.stdin)['case']; assert c['recommendation']=='ready', c; print('ok', c['status'])"
      - if: always()
        run: docker logs ap || true

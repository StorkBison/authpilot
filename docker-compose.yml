# docker compose up --build                 -> app + PostgreSQL (synthetic FHIR bundles served locally)
# docker compose --profile fhir up --build  -> also starts a HAPI FHIR server; then load it with
#   python scripts/load_fhir_server.py http://localhost:8080/fhir
# and set FHIR_BASE_URL=http://fhir:8080/fhir in .env to read the chart over the FHIR API.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authpilot
      POSTGRES_PASSWORD: authpilot
      POSTGRES_DB: authpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authpilot"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://authpilot:authpilot@db:5432/authpilot
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  fhir:
    profiles: ["fhir"]
    image: hapiproject/hapi:v7.4.0
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.client_id_strategy: ANY

volumes:
  pgdata:
